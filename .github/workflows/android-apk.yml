name: Build downloadable Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "configure-mobile.cjs", ".github/workflows/android-apk.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle game and configure live updates
        run: node configure-mobile.cjs https://bada7745-cloud.github.io/parkgyeongjin/
      - name: Compile installable Android test APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Inspect and name APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Pocket-Critters-Android.apk
          sha256sum Pocket-Critters-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Critters-Android
          path: |
            Pocket-Critters-Android.apk
            SHA256SUMS.txt
      - name: Publish downloadable test app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-${GITHUB_SHA:0:8}"
          gh release create "$TAG" Pocket-Critters-Android.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "포켓 크리터즈 Android 테스트 앱" --notes "Android 설치용 테스트 APK입니다. 게임 콘텐츠는 실행 시 배포된 무료 게임 주소에서 불러옵니다. iPhone은 홈 화면 설치 안내를 이용하세요." --prerelease
